    <text x="40" y="606">): <tspan fill="#7DD3FC">Promise</tspan>&lt;<tspan fill="#7DD3FC">number</tspan>&gt; {</text>
    <text x="40" y="626">  <tspan fill="#F472B6">await</tspan> ready(); <tspan fill="#F472B6">return</tspan> a + b</text>
  </g>

